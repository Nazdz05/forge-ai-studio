name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:windows
          - os: macos-latest
            script: build:macos
          - os: ubuntu-22.04
            script: build:linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Generate platform icons
        run: npm run tauri -- icon src-tauri/icons/forge.svg --output src-tauri/icons

      - name: Build app bundles
        run: npm run ${{ matrix.script }}

      - name: Save installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-ai-studio-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
